name: CI

on:
  push:
    branches: [trunk]
  pull_request:
  # release: publish once the checks pass whatever changed. The weekly
  # update sets it when it moved something a release is made of, its push
  # having started nothing.
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        default: false

# check is the fast one, `mise run check` with mise's Zig: the unit and
# property tests, fdlint, compile-fail and zig fmt. The rest is Nix's: one
# job per check, so the VM tests, the Zig builds and the assertion
# shards run on parallel runners and a slow one no longer holds up the
# rest (the single `nix flake check` step took 9.5-12.8 min in runs
# 35947311755, 35954009898 and 35958022199; the matrix takes about 5-6 min
# for a push that changes the native code, 5 min 38 s and 5 min 54 s in runs
# 35995141108 and 35996579837, its longest leg native-test-release, and
# 3-4 min for one that does not, 3 min 18 s and 3 min 39 s in runs
# 35991513067 and 35992523422). `list` names the checks,
# `nix` builds each (fail-fast off, so one red check does not hide
# another), and `eval` evaluates the flake's other outputs.
#
# cachix/install-nix-action enables KVM on the standard runner ("Enabled
# KVM" in the logs; the guests use kvm-clock), so the VM tests run on
# hardware virtualisation, not emulation. `kvm` in system-features is what
# lets Nix schedule them.
#
# The binary cache is Cachix's danielbodart (public, free tier, 5 GB).
# Every job that builds reads it; a leg on trunk that is not a VM test
# pushes flong's own outputs, and only when CACHIX_AUTH_TOKEN is set, and
# the cache job pushes the packages (the checks build them as version
# "0", native.nix says why). Elsewhere the cache is read-only.

# bash -eo pipefail for every run step.
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The tests link libseccomp, which is the host's (mise.toml).
      - name: libseccomp
        run: sudo apt-get update -q && sudo apt-get install -y -q libseccomp-dev

      # zig, at the version mise.toml pins.
      - uses: jdx/mise-action@v5

      # Zig's global cache: the dependency fetch (minish, zwanzig) and the
      # compiled standard library.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/zig
          key: zig-${{ hashFiles('build.zig.zon', 'mise.toml') }}
          restore-keys: zig-

      - run: mise run check

  list:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.list.outputs.checks }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      # Nothing is built here, so nothing is pushed.
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      # The names only; each check is evaluated in its own leg below.
      - id: list
        run: echo "checks=$(nix eval --json .#checks.x86_64-linux --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  nix:
    needs: [list]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.list.outputs.checks) }}
    name: nix (${{ matrix.check }})
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      # skipPush: the action's own push sends every path a build made, less
      # what an exclude-only pushFilter matches (a grep -v in its
      # post-build hook), so a VM test's NixOS closure would go too. The
      # last step pushes an allow-list instead.
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: nix build ${{ matrix.check }}
        run: nix build -L --no-link ".#checks.x86_64-linux.${{ matrix.check }}"

      # The free tier is 5 GB, so only flong's own derivations are pushed,
      # by name: the Zig sets (flong-launcher, flong-seccomp,
      # flong-fixtures), the seccomp tiers' filters
      # (flong-seccomp-*), the dependency fetch (flong-<v>-zig-deps), the
      # integration derivations (flong-drivers, flong-proofs-vm,
      # integration), and the checks that are builds, not VMs: native-*,
      # cross-aarch64, golden*, shellcheck and the assertion shards. A VM
      # test's result (vm-test-run-*), its driver, the NixOS system it
      # boots and the module's per-test scripts (flong-payload-* and the
      # like) match none of these, so are never pushed. The candidates are
      # the outputs of the check's derivation closure present in this
      # runner's store; cachix push sends each with its closure, but skips
      # what cache.nixos.org has, so nixpkgs' packages are not pushed
      # either. Run on a failure too, so what did build is there for the
      # rerun.
      #
      # Not from a VM test, named in the list below (every check that boots
      # a VM, runNixOSTest in flake.nix): what it builds of flong's own is
      # what the launcher, seccomp, native-test-*, golden and integration
      # legs build and push anyway, and the step cost it the check's
      # evaluation again, 17-52 s in run 35963498671. It still reads the
      # cache. A VM test missing from the list costs that time, not cache
      # space: the allow-list below matches none of a VM test's own paths.
      - name: Push flong's own outputs to Cachix
        if: ${{ !cancelled() && github.ref == 'refs/heads/trunk' && !contains(fromJSON('["basic-a", "basic-b", "rootless-a", "rootless-b", "parity", "native"]'), matrix.check) }}
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CHECK: ${{ matrix.check }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then
            echo "No CACHIX_AUTH_TOKEN (a fork's pull request): nothing is pushed."
            exit 0
          fi
          drv="$(nix eval --raw ".#checks.x86_64-linux.$CHECK.drvPath")"
          nix-store --query --requisites "$drv" | grep '\.drv$' \
            | xargs nix-store --query --outputs | sort -u \
            | while read -r p; do if [ -e "$p" ]; then echo "$p"; fi; done \
            | { grep -E '^/nix/store/[a-z0-9]{32}-(flong-(launcher|seccomp|fixtures|drivers|proofs-vm)|flong-[0-9]+-zig-deps|native-(test-debug|test-release|lint|analyze)|cross-aarch64|golden|integration|shellcheck|assertions-[0-9])' || true; } \
            > push.txt
          echo "Pushing $(wc -l < push.txt) paths, with their closures:"
          cat push.txt
          if [ -s push.txt ]; then cachix push danielbodart < push.txt; fi

  # What `nix flake check` checks besides building the checks: that every
  # output (the module, bench, the apps, the dev shell, the formatter)
  # evaluates and has the right shape.
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      - name: nix flake check --no-build
        run: nix flake check --no-build

  # CONTINUOUS RELEASE. Trunk-based: a push to trunk that passes every check
  # above is published, with no manual step and no tag to cut by hand, when
  # it changed what a release is made of: anything in mise.toml's
  # RELEASE_PATHS since the last release tag (`mise run release-due`), the
  # module and the code it builds, flake.nix and flake.lock. The workflows,
  # docs and tests alone release nothing. A dispatch with `release` publishes
  # whatever changed. Never a pull request, and never unless `check` and
  # every leg of `nix` and `eval` succeeded, so a red commit never ships.
  #
  # The derived version (major.commit-count.run-number, scripts/version.sh)
  # makes every build a unique, monotonic release, so two pushes cannot collide
  # on a tag and a re-run of the same commit does not either.
  release:
    needs: [check, nix, eval]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/trunk' && needs.check.result == 'success' && needs.nix.result == 'success' && needs.eval.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 because the minor is the commit count and the script
      # REFUSES a shallow clone; fetch-tags so the previous tag resolves, for
      # release-due and for the notes generated below.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: jdx/mise-action@v5

      - name: Is a release due?
        id: due
        env:
          FORCE: ${{ inputs.release }}
        run: |
          if [ "$FORCE" = true ] || mise run release-due; then due=true; else due=false; fi
          echo "Release due: $due"
          echo "due=$due" >> "$GITHUB_OUTPUT"

      # Notes from the COMMITS since the last release. Trunk-based means direct
      # pushes and no pull requests, so GitHub's PR-based --generate-notes
      # would come out empty. On the first release there is no prior tag, so
      # fall back to the head commit rather than dumping the whole history.
      - name: Create GitHub Release
        if: steps.due.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(./scripts/version.sh)"
          PREV="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            git log "$PREV..HEAD" --pretty='- %s (%h)' > notes.md
          else
            { echo 'First automated release.'; echo; git log -1 --pretty='- %s (%h)'; } > notes.md
          fi
          gh release create "v$V" --title "v$V" --notes-file notes.md --target "$GITHUB_SHA"

  # flong's packages, the launcher and flong-seccomp at 0-unstable-<date>, as
  # the module and nix-config build them, to the cache from trunk; never a
  # VM test's closure (the free tier is 5 GB).
  cache:
    needs: [check, nix, eval]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Push flong's packages to Cachix
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then echo "No CACHIX_AUTH_TOKEN: nothing is pushed."; exit 0; fi
          nix build --no-link --print-out-paths .#default .#seccomp | cachix push danielbodart
